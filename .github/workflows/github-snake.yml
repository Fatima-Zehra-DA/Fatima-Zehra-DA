name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Fatima-Zehra-DA
          gif_out_path: dist/github-snake.gif
          svg_out_path: dist/github-snake.svg
          snake_out_path: dist/github-snake-dark.svg
          # custom colors matching banner
          args: >
            --color-snake "#a78bfa"
            --color-dots "#1e293b,#334155,#475569,#8b5cf6,#60a5fa"
            --color-dot_border "#0f172a"

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          git checkout --orphan output || git checkout output
          git add dist/
          git commit -m "Update snake animation" || echo "No changes"
          git push origin output --force
          git checkout main
